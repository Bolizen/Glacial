name: glib backport invariant

on:
  pull_request_target:
    branches:
      - main
    paths:
      - "frontend/src-tauri/Cargo.toml"
      - "frontend/src-tauri/Cargo.lock"
      - "third_party/rust/glib-0.18.5-patched/**"
      - "scripts/security/verify-glib-backport.mjs"
      - "docs/security/glib-0.18.5-backport.md"
      - ".github/workflows/glib-backport.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/src-tauri/Cargo.toml"
      - "frontend/src-tauri/Cargo.lock"
      - "third_party/rust/glib-0.18.5-patched/**"
      - "scripts/security/verify-glib-backport.mjs"
      - "docs/security/glib-0.18.5-backport.md"
      - ".github/workflows/glib-backport.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify audited glib backport
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted pull request base
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      # SECURITY: pull_request_target has privileged base-repository context.
      # The candidate checkout is untrusted data only. Never execute, import,
      # source, install, build, or evaluate anything from candidate.
      - name: Check out pull request candidate as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out trusted pushed commit
        if: github.event_name == 'push'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: trusted
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"

      - name: Verify pull request candidate with trusted verifier
        if: github.event_name == 'pull_request_target'
        run: node trusted/scripts/security/verify-glib-backport.mjs --repo-root candidate

      - name: Verify pushed glib backport invariants
        if: github.event_name == 'push'
        run: node trusted/scripts/security/verify-glib-backport.mjs --repo-root trusted
