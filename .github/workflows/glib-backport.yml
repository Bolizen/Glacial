name: glib backport invariant

on:
  pull_request:
    paths:
      - "frontend/src-tauri/Cargo.toml"
      - "frontend/src-tauri/Cargo.lock"
      - "third_party/rust/glib-0.18.5-patched/**"
      - "scripts/security/verify-glib-backport.mjs"
      - "docs/security/glib-0.18.5-backport.md"
      - ".github/workflows/glib-backport.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/src-tauri/Cargo.toml"
      - "frontend/src-tauri/Cargo.lock"
      - "third_party/rust/glib-0.18.5-patched/**"
      - "scripts/security/verify-glib-backport.mjs"
      - "docs/security/glib-0.18.5-backport.md"
      - ".github/workflows/glib-backport.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify audited glib backport
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.17.1"

      - name: Verify glib backport invariants
        run: node scripts/security/verify-glib-backport.mjs
